<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elsa Game</title>

  <style>
    :root {
      --bg-color: #0d0f18;
      --card-bg: #1a1d2e;
      --accent-color: #ffd700;
      --primary-btn: #e94560;
      --text-color: #ffffff;
      --border-color: #2a2e45;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      color: var(--accent-color);
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      margin-bottom: 5px;
    }

    .auth-container {
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      margin-top: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
      transition: all 0.2s;
    }

    .auth-btn:hover {
      background: #3367d6;
      transform: translateY(-2px);
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 20px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      object-fit: cover;
    }

    .currencies {
      display: flex;
      gap: 10px;
      font-weight: bold;
      align-items: center;
    }

    .currency-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.3);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .transfer-btn {
      background: #00b894;
      color: white;
      border: none;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .transfer-btn:hover {
      background: #00a884;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: var(--card-bg);
      color: #aaa;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .checkin-banner, .weekly-banner {
      background: linear-gradient(135deg, #2b1055, #7597de);
      border-radius: 12px;
      padding: 15px 20px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .weekly-banner {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      border: 2px solid var(--accent-color);
    }

    .banner-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .checkin-btn, .weekly-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }

    .admin-box {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 10px;
      padding: 12px;
      margin-top: 5px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-player-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 5px;
      background: rgba(0,0,0,0.2);
    }

    .admin-player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .admin-player-item:hover, .admin-player-item.selected {
      background: rgba(255, 215, 0, 0.2);
    }

    .slot-section {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slot-machine {
      background: #16213e;
      border: 6px solid var(--accent-color);
      border-radius: 20px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      width: 100%;
    }

    .reels-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .reel-window {
      width: 110px;
      height: 220px;
      border: 3px solid var(--accent-color);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    .reel-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .card-item {
      width: 110px;
      height: 220px;
      position: relative;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rarity-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .bg-SS { background: linear-gradient(45deg, #ff007f, #7f00ff); }
    .bg-S  { background: linear-gradient(45deg, #ff4e50, #f9d423); }
    .bg-A  { background: linear-gradient(45deg, #00c6ff, #0072ff); }
    .bg-B  { background: linear-gradient(45deg, #11998e, #38ef7d); }
    .bg-C  { background: linear-gradient(45deg, #bdc3c7, #2c3e50); }

    .spin-btn {
      background: linear-gradient(180deg, #ff4757, #e84118);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(232, 65, 24, 0.5);
      transition: all 0.2s;
    }

    .spin-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(232, 65, 24, 0.7);
    }

    .spin-btn:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .gallery-section {
      width: 100%;
      max-width: 600px;
      display: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (min-width: 480px) {
      .gallery-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .gallery-card {
      position: relative;
      aspect-ratio: 1 / 1.8;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .gallery-card:hover {
      transform: scale(1.05);
      border-color: var(--accent-color);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .count-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .modal-img-container {
      width: 100%;
      aspect-ratio: 1 / 2;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
    }

    .modal-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-info {
      font-size: 0.95rem;
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .modal-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-delete {
      background: #d63031;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-delete-all {
      background: #e67e22;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-close {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .player-list-container {
      max-height: 220px;
      overflow-y: auto;
      margin: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      background: rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .player-card.selected {
      background: rgba(255, 215, 0, 0.2);
      border-color: var(--accent-color);
    }

    .player-info-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent-color);
    }

    .btn-action-transfer {
      background: #00b894;
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-color);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>🎰 Elsa Game</h1>
  </header>

  <!-- Login Block -->
  <div id="authBlock" class="auth-container">
    <h2>歡迎來到 Elsa Game</h2>
    <p id="statusMsg" style="margin-top: 10px; color: #aaa;">請使用 Google 帳號登入進行遊玩</p>
    <button id="loginBtn" class="auth-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
      Google 帳號登入
    </button>
  </div>

  <!-- Game Main Block -->
  <div id="gameBlock" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <!-- User Status Bar -->
    <div class="user-bar">
      <div class="user-info">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <div>
          <span id="userName" style="font-weight: bold;">--</span>
        </div>
      </div>
      <div class="currencies">
        <div class="currency-item">
          💎 <span id="diamond">0</span>
        </div>
        <button id="openPlayerListBtn" class="transfer-btn">👥 玩家</button>
      </div>
    </div>

    <!-- Creator Special Area for 蔡嘉修 -->
    <div id="weeklyBanner" class="weekly-banner hidden">
      <div class="banner-row">
        <div>
          <div style="font-weight: bold; font-size: 1.05rem; color: var(--accent-color);">👑 蔡嘉修 創世主控制台</div>
          <div style="font-size: 0.85rem; opacity: 0.9;">無限自領鑽石 & 任意調控他人鑽石</div>
        </div>
        <button id="weeklyBtn" class="weekly-btn">無限領 100 💎</button>
      </div>

      <!-- Admin Diamond Controller -->
      <div class="admin-box">
        <div style="font-size: 0.85rem; font-weight: bold; color: var(--accent-color); display: flex; justify-content: space-between;">
          <span>🌐 所有玩家鑽石即時監控：</span>
          <span id="refreshAdminListBtn" style="cursor: pointer; text-decoration: underline;">🔄 重新整理</span>
        </div>
        
        <!-- Player List -->
        <div id="adminPlayerList" class="admin-player-list"></div>

        <!-- Selected Player Target & Edit Input -->
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div id="adminSelectedText" style="font-size: 0.8rem; color: #fff;">尚未選擇玩家</div>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="adminNewDiamondInput" class="form-input" placeholder="直接設定鑽石總數 (例如 9999)" min="0">
            <button id="adminUpdateDiamondBtn" class="checkin-btn" style="white-space: nowrap; padding: 0 15px;">直接修改</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tabSpin" class="tab-btn active">🎰 開始抽卡</button>
      <button id="tabGallery" class="tab-btn">😍 我的圖鑑 (<span id="totalCardsCount">0</span>)</button>
    </div>

    <!-- Daily Check-in -->
    <div class="checkin-banner">
      <div class="banner-row">
        <div>
          <div style="font-weight: bold; font-size: 1.05rem;">🗓️ 每日簽到領鑽石</div>
          <div id="checkinRewardText" style="font-size: 0.85rem; opacity: 0.9;">今日獎勵：-- 💎</div>
        </div>
        <button id="checkinBtn" class="checkin-btn">領取</button>
      </div>
    </div>

    <!-- Slot Section -->
    <div id="slotSection" class="slot-section">
      <div class="slot-machine">
        <div class="reels-container">
          <div class="reel-window"><div id="reel1" class="reel-strip"></div></div>
          <div class="reel-window"><div id="reel2" class="reel-strip"></div></div>
          <div class="reel-window"><div id="reel3" class="reel-strip"></div></div>
        </div>
        <button id="spinBtn" class="spin-btn">拉動拉霸！(1 💎)</button>
      </div>
    </div>

    <!-- Gallery Section -->
    <div id="gallerySection" class="gallery-section">
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>

  </div>

  <!-- Detail Modal -->
  <div id="cardModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Card">
        <div id="modalRarity" class="rarity-badge"></div>
      </div>
      <div id="modalDate" class="modal-info"></div>
      <div class="modal-btn-group">
        <button id="deleteCardBtn" class="btn-delete">分解單張 (+<span id="modalRefundVal">0</span> 💎)</button>
        <button id="deleteAllCardBtn" class="btn-delete-all">全部分解 (<span id="modalTotalCount">0</span>張，+<span id="modalTotalRefundVal">0</span> 💎)</button>
        <button id="closeModalBtn" class="btn-close">關閉</button>
      </div>
    </div>
  </div>

  <!-- Player List & Transfer Modal -->
  <div id="playerListModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-bottom: 5px; color: var(--accent-color);">👥 玩家列表</h3>
      <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 8px;">點擊玩家旁的「轉贈」即可送出鑽石：</p>
      
      <div id="playerListContainer" class="player-list-container"></div>

      <div id="transferFormSection" style="margin-top: 10px;">
        <p id="selectedPlayerText" style="font-size: 0.85rem; color: var(--accent-color); margin-bottom: 8px; font-weight: bold;">尚未選擇對象</p>
        <input type="number" id="transferAmount" class="form-input" placeholder="請輸入轉贈鑽石數量" min="1" style="margin-bottom: 10px;">
      </div>

      <div class="modal-btn-group" style="margin-top: 5px;">
        <button id="confirmTransferBtn" class="btn-delete" style="background: #00b894;">確認轉贈送出</button>
        <button id="closePlayerListModalBtn" class="btn-close">關閉</button>
      </div>
    </div>
  </div>

  <!-- Firebase v10 SDK Modules -->

      cards: []
    };

    let activeModalCardId = null;
    let selectedTargetUser = null;
    let adminSelectedUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('statusMsg').innerText = "登入成功，讀取資料中...";
        loadUserDataFromFirebase();
      } else {
        document.getElementById('authBlock').classList.remove('hidden');
        document.getElementById('gameBlock').classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => {
        alert("登入失敗：\n" + err.message);
      });
    });

    function saveUserData() {
      if (!currentUser) return;
      userData.displayName = currentUser.displayName || "";
      userData.email = currentUser.email || "";
      userData.photoURL = currentUser.photoURL || "https://picsum.photos/100";
      
      set(ref(db, 'users/' + currentUser.uid), userData).catch(err => console.error("存檔失敗", err));
    }

    function loadUserDataFromFirebase() {
      const dbRef = ref(db);
      get(child(dbRef, `users/${currentUser.uid}`)).then((snapshot) => {
        userData.displayName = currentUser.displayName || "";
        userData.email = currentUser.email || "";
        userData.photoURL = currentUser.photoURL || "https://picsum.photos/100";

        if (snapshot.exists()) {
          const val = snapshot.val();
          userData.diamond = val.diamond !== undefined ? val.diamond : 10;
          userData.lastCheckinDate = val.lastCheckinDate || "";
          userData.cards = val.cards || [];
        } else {
          userData.diamond = 10;
          userData.lastCheckinDate = "";
          userData.cards = [];
        }
        saveUserData();
        showGameUI();
      }).catch((error) => {
        userData.displayName = currentUser.displayName || "";
        userData.email = currentUser.email || "";
        userData.photoURL = currentUser.photoURL || "https://picsum.photos/100";
        showGameUI();
      });
    }

    function showGameUI() {
      document.getElementById('authBlock').classList.add('hidden');
      document.getElementById('gameBlock').classList.remove('hidden');
      
      const name = currentUser.displayName || currentUser.email || "玩家";
      document.getElementById('userName').innerText = name;
      document.getElementById('userAvatar').src = currentUser.photoURL || "https://picsum.photos/100";

      if (name.includes("蔡嘉修")) {
        document.getElementById('weeklyBanner').classList.remove('hidden');
        loadAdminPlayerList();
      } else {
        document.getElementById('weeklyBanner').classList.add('hidden');
      }

      initReels();
      updateCheckinUI();
      updateUI();
    }

    document.getElementById('weeklyBtn').addEventListener('click', () => {
      userData.diamond += 100;
      saveUserData();
      updateUI();
      alert(`👑 尊貴的 蔡嘉修，已無限領取 100 💎！（當前總額：${userData.diamond} 💎）`);
    });

    // 創世主專區：載入所有玩家列表與鑽石數
    function loadAdminPlayerList() {
      const listEl = document.getElementById('adminPlayerList');
      listEl.innerHTML = `<div style="text-align:center; color:#888;">載入玩家列表中...</div>`;

      const dbRef = ref(db);
      get(child(dbRef, 'users')).then((snapshot) => {
        listEl.innerHTML = '';
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (let uid in users) {
            const u = users[uid];
            const uName = u.displayName || u.email || "未知帳號";
            const uMail = u.email ? `(${u.email})` : '';
            const uDiamond = u.diamond !== undefined ? u.diamond : 0;

            const item = document.createElement('div');
            item.className = 'admin-player-item';
            item.innerHTML = `
              <div>
                <strong>${uName}</strong> <span style="font-size:0.75rem; color:#aaa;">${uMail}</span>
              </div>
              <div style="color: var(--accent-color); font-weight: bold;">
                💎 ${uDiamond}
              </div>
            `;

            item.onclick = () => {
              document.querySelectorAll('.admin-player-item').forEach(el => el.classList.remove('selected'));
              item.classList.add('selected');
              adminSelectedUser = { uid, ...u, displayName: uName };
              document.getElementById('adminSelectedText').innerText = `已選擇對象：${uName} (目前鑽石：${uDiamond})`;
              document.getElementById('adminNewDiamondInput').value = uDiamond;
            };

            listEl.appendChild(item);
          }
        } else {
          listEl.innerHTML = `<div style="text-align:center; color:#888;">目前尚無任何玩家數據</div>`;
        }
      }).catch(err => {
        listEl.innerHTML = `<div style="text-align:center; color:#e74c3c;">載入失敗: ${err.message}</div>`;
      });
    }

    document.getElementById('refreshAdminListBtn').addEventListener('click', loadAdminPlayerList);

    // 創世主專區：直接修改特定玩家鑽石
    document.getElementById('adminUpdateDiamondBtn').addEventListener('click', () => {
      if (!adminSelectedUser) {
        alert("請先點擊上方列表中要修改的玩家！");
        return;
      }

      const newVal = parseInt(document.getElementById('adminNewDiamondInput').value, 10);
      if (isNaN(newVal) || newVal < 0) {
        alert("請輸入有效的鑽石數量（需大於等於 0）！");
        return;
      }

      update(ref(db, `users/${adminSelectedUser.uid}`), { diamond: newVal }).then(() => {
        alert(`🎉 已成功將「${adminSelectedUser.displayName}」的鑽石修改為 ${newVal} 💎！`);
        if (adminSelectedUser.uid === currentUser.uid) {
          userData.diamond = newVal;
          updateUI();
        }
        loadAdminPlayerList();
      }).catch(err => {
        alert("修改失敗：" + err.message);
      });
    });

    document.getElementById('openPlayerListBtn').addEventListener('click', () => {
      document.getElementById('playerListModal').style.display = 'flex';
      selectedTargetUser = null;
      document.getElementById('selectedPlayerText').innerText = "尚未選擇對象";
      document.getElementById('transferAmount').value = '';
      loadPlayerList();
    });

    document.getElementById('closePlayerListModalBtn').addEventListener('click', () => {
      document.getElementById('playerListModal').style.display = 'none';
    });

    function loadPlayerList() {
      const container = document.getElementById('playerListContainer');
      container.innerHTML = `<div style="text-align: center; color: #aaa; padding: 10px;">讀取玩家列表中...</div>`;

      const dbRef = ref(db);
      get(child(dbRef, 'users')).then((snapshot) => {
        container.innerHTML = '';
        if (snapshot.exists()) {
          const users = snapshot.val();
          let count = 0;

          for (let uid in users) {
            if (uid === currentUser.uid) continue;

            count++;
            const u = users[uid];
            
            let name = u.displayName;
            if (!name || name === "Google 玩家" || name === "玩家") {
              name = u.email || "未知帳號";
            }

            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = `player-card-${uid}`;

            card.innerHTML = `
              <div class="player-info-left">
                <img class="player-avatar-small" src="${u.photoURL || 'https://picsum.photos/100'}" alt="avatar">
                <div style="text-align: left;">
                  <div style="font-weight: bold; font-size: 0.9rem;">${name}</div>
                  <div style="font-size: 0.75rem; color: #aaa;">💎 ${u.diamond || 0}</div>
                </div>
              </div>
              <button class="btn-action-transfer">轉贈 🎁</button>
            `;

            const btn = card.querySelector('.btn-action-transfer');
            btn.onclick = () => {
              document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
              card.classList.add('selected');
              selectedTargetUser = { uid, ...u, displayName: name };
              document.getElementById('selectedPlayerText').innerText = `已選擇轉贈對象：${name}`;
              document.getElementById('transferAmount').focus();
            };

            container.appendChild(card);
          }

          if (count === 0) {
            container.innerHTML = `<div style="text-align: center; color: #aaa; padding: 10px;">目前尚無其他玩家</div>`;
          }
        } else {
          container.innerHTML = `<div style="text-align: center; color: #aaa; padding: 10px;">尚無其他玩家資料</div>`;
        }
      }).catch(err => {
        container.innerHTML = `<div style="text-align: center; color: #e74c3c; padding: 10px;">載入失敗 (請確認 Firebase Rules 設定)</div>`;
      });
    }

    document.getElementById('confirmTransferBtn').addEventListener('click', () => {
      if (!selectedTargetUser) {
        alert("請先點擊玩家後方的「轉贈」按鈕選定對象！");
        return;
      }

      const amount = parseInt(document.getElementById('transferAmount').value, 10);

      if (isNaN(amount) || amount <= 0) {
        alert("請輸入有效的轉贈數量！");
        return;
      }

      if (userData.diamond < amount) {
        alert("你的鑽石數量不足！");
        return;
      }

      userData.diamond -= amount;
      const newTargetDiamond = (selectedTargetUser.diamond || 0) + amount;

      saveUserData();
      update(ref(db, `users/${selectedTargetUser.uid}`), { diamond: newTargetDiamond }).then(() => {
        updateUI();
        document.getElementById('playerListModal').style.display = 'none';
        alert(`🎉 成功轉贈 ${amount} 💎 給 ${selectedTargetUser.displayName}！`);
      }).catch(err => {
        alert("轉贈失敗：" + err.message);
      });
    });

    function getTodayCheckinReward() {
      const day = new Date().getDay();
      if (day === 1) return 8;
      if (day === 2) return 7;
      if (day === 3) return 6;
      return 5;
    }

    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    function updateCheckinUI() {
      const reward = getTodayCheckinReward();
      const todayStr = getTodayDateString();
      document.getElementById('checkinRewardText').innerText = `今日獎勵：${reward} 💎`;
      
      const checkinBtn = document.getElementById('checkinBtn');
      if (userData.lastCheckinDate === todayStr) {
        checkinBtn.disabled = true;
        checkinBtn.innerText = "今日已領取";
      } else {
        checkinBtn.disabled = false;
        checkinBtn.innerText = "領取";
      }
    }

    document.getElementById('checkinBtn').addEventListener('click', () => {
      const todayStr = getTodayDateString();
      if (userData.lastCheckinDate === todayStr) return;

      const reward = getTodayCheckinReward();
      userData.diamond += reward;
      userData.lastCheckinDate = todayStr;

      saveUserData();
      updateCheckinUI();
      updateUI();
      alert(`🎉 成功領取每日簽到獎勵：${reward} 💎！`);
    });

    function initReels() {
      ['reel1', 'reel2', 'reel3'].forEach(id => {
        const reel = document.getElementById(id);
        let html = '';
        for (let i = 0; i < 12; i++) {
          CARD_DATABASE.forEach(card => {
            html += `
              <div class="card-item">
                <img src="${card.url}" alt="${card.name}">
                <div class="rarity-badge bg-${card.rarity}">${card.rarity}</div>
              </div>
            `;
          });
        }
        reel.innerHTML = html;
      });
    }

    function drawOutcome() {
      const rand = Math.random() * 100;
      if (rand < 50) return { win: false, rarity: null };
      if (rand < 70) return { win: true, rarity: 'C' };
      if (rand < 85) return { win: true, rarity: 'B' };
      if (rand < 95) return { win: true, rarity: 'A' };
      if (rand < 99) return { win: true, rarity: 'S' };
      return { win: true, rarity: 'SS' };
    }

    function getRandomCardByRarity(rarity) {
      const filtered = CARD_DATABASE.filter(c => c.rarity === rarity);
      return filtered[Math.floor(Math.random() * filtered.length)];
    }

    function getRandomCard() {
      return CARD_DATABASE[Math.floor(Math.random() * CARD_DATABASE.length)];
    }

    function calculateConsolationBonus(cards) {
      const rarityCounts = {};
      const idCounts = {};

      cards.forEach(c => {
        rarityCounts[c.rarity] = (rarityCounts[c.rarity] || 0) + 1;
        idCounts[c.id] = (idCounts[c.id] || 0) + 1;
      });

      if (rarityCounts['SS'] === 2) return { bonus: 3, reason: "出現 2 個 SS 級！" };
      if (rarityCounts['S'] === 2) return { bonus: 2, reason: "出現 2 個 S 級！" };

      for (let card of cards) {
        if (card.rarity === 'A' && idCounts[card.id] === 2) {
          return { bonus: 1, reason: "出現 2 個相同的 A 級！" };
        }
      }

      for (let card of cards) {
        if ((card.rarity === 'B' || card.rarity === 'C') && idCounts[card.id] === 2) {
          return { bonus: 0.5, reason: `出現 2 個相同的 ${card.rarity} 級！` };
        }
      }

      if (rarityCounts['SS'] === 1) return { bonus: 2, reason: "出現 1 個 SS 級！" };
      if (rarityCounts['S'] === 1) return { bonus: 1, reason: "出現 1 個 S 級！" };

      return { bonus: 0, reason: "" };
    }

    document.getElementById('spinBtn').addEventListener('click', () => {
      if (userData.diamond < 1) {
        alert("⚠️ 鑽石不足，拉動一次需要 1 💎！");
        return;
      }

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;

      userData.diamond -= 1;
      updateUI();

      const outcome = drawOutcome();
      let resCard1, resCard2, resCard3;
      let wonCard = null;

      if (outcome.win) {
        wonCard = getRandomCardByRarity(outcome.rarity);
        resCard1 = wonCard;
        resCard2 = wonCard;
        resCard3 = wonCard;
      } else {
        resCard1 = getRandomCard();
        resCard2 = getRandomCard();
        resCard3 = getRandomCard();
        while (resCard1.id === resCard2.id && resCard2.id === resCard3.id) {
          resCard3 = getRandomCard();
        }
      }

      const results = [resCard1, resCard2, resCard3];
      const reelIds = ['reel1', 'reel2', 'reel3'];

      reelIds.forEach((id, idx) => {
        const reel = document.getElementById(id);
        const cardIndex = CARD_DATABASE.findIndex(c => c.id === results[idx].id);
        const rounds = 8 + idx * 2;
        const targetOffset = (rounds * CARD_DATABASE.length + cardIndex) * CARD_HEIGHT;

        reel.style.transition = `transform ${3 + idx * 0.5}s cubic-bezier(0.15, 0.85, 0.35, 1.15)`;
        reel.style.transform = `translateY(-${targetOffset}px)`;

        setTimeout(() => {
          reel.style.transition = 'none';
          reel.style.transform = `translateY(-${cardIndex * CARD_HEIGHT}px)`;
        }, (3 + idx * 0.5) * 1000 + 100);
      });

      setTimeout(() => {
        if (outcome.win && wonCard) {
          const newInstance = {
            instanceId: "inst_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            cardId: wonCard.id,
            obtainedAt: new Date().toLocaleString('zh-TW')
          };
          userData.cards.push(newInstance);
          saveUserData();
          updateUI();
          alert(`🎉 恭喜大獎！三個連線獲得張綺文 [${wonCard.rarity}級] ${wonCard.name}！`);
        } else {
          const reward = calculateConsolationBonus(results);
          if (reward.bonus > 0) {
            userData.diamond += reward.bonus;
            saveUserData();
            updateUI();
            alert(`❌ 沒有連線獲得張綺文！\n🎁 安慰獎：${reward.reason} 獲得 ${reward.bonus} 💎！`);
          } else {
            saveUserData();
            alert(`❌ 銘謝惠顧！張綺文不喜歡你！他是我的😍`);
          }
        }
        spinBtn.disabled = false;
      }, 4200);
    });

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      if (!userData.cards || userData.cards.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">尚無卡片，快去拉霸機試試手氣吧！</div>`;
        return;
      }

      const cardCounts = {};
      userData.cards.forEach(item => {
        cardCounts[item.cardId] = (cardCounts[item.cardId] || 0) + 1;
      });

      const uniqueCardIds = Object.keys(cardCounts);

      uniqueCardIds.forEach(cardId => {
        const cardData = CARD_DATABASE.find(c => c.id === cardId);
        if (!cardData) return;

        const count = cardCounts[cardId];

        const cardEl = document.createElement('div');
        cardEl.className = 'gallery-card';
        cardEl.onclick = () => openModal(cardData, count);

        cardEl.innerHTML = `
          <img src="${cardData.url}" alt="${cardData.name}">
          <div class="rarity-badge bg-${cardData.rarity}">${cardData.rarity}</div>
          <div class="count-badge">x${count}</div>
        `;
        grid.appendChild(cardEl);
      });
    }

    function openModal(cardData, count) {
      activeModalCardId = cardData.id;
      document.getElementById('modalImg').src = cardData.url;
      
      const badge = document.getElementById('modalRarity');
      badge.innerText = cardData.rarity;
      badge.className = `rarity-badge bg-${cardData.rarity}`;

      document.getElementById('modalDate').innerHTML = `
        <strong>${cardData.name}</strong><br>
        目前擁有：${count} 張
      `;
      document.getElementById('modalRefundVal').innerText = cardData.refund;
      document.getElementById('modalTotalCount').innerText = count;
      document.getElementById('modalTotalRefundVal').innerText = (cardData.refund * count);

      document.getElementById('cardModal').style.display = 'flex';
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('cardModal').style.display = 'none';
      activeModalCardId = null;
    });

    document.getElementById('deleteCardBtn').addEventListener('click', () => {
      if (!activeModalCardId) return;

      const idx = userData.cards.findIndex(c => c.cardId === activeModalCardId);
      if (idx !== -1) {
        const cardData = CARD_DATABASE.find(c => c.id === activeModalCardId);

        userData.diamond += cardData.refund;
        userData.cards.splice(idx, 1);

        saveUserData();
        updateUI();
        document.getElementById('cardModal').style.display = 'none';
        alert(`🗑️ 已分解 1 張卡片，獲得 ${cardData.refund} 💎！`);
      }
    });

    document.getElementById('deleteAllCardBtn').addEventListener('click', () => {
      if (!activeModalCardId) return;

      const cardData = CARD_DATABASE.find(c => c.id === activeModalCardId);
      const targetCards = userData.cards.filter(c => c.cardId === activeModalCardId);
      const count = targetCards.length;

      if (count > 0) {
        const totalRefund = cardData.refund * count;
        userData.diamond += totalRefund;
        userData.cards = userData.cards.filter(c => c.cardId !== activeModalCardId);

        saveUserData();
        updateUI();
        document.getElementById('cardModal').style.display = 'none';
        alert(`🗑️ 已全部分解 ${count} 張卡片，獲得 ${totalRefund} 💎！`);
      }
    });

    document.getElementById('tabSpin').addEventListener('click', () => {
      document.getElementById('tabSpin').classList.add('active');
      document.getElementById('tabGallery').classList.remove('active');
      document.getElementById('slotSection').style.display = 'flex';
      document.getElementById('gallerySection').style.display = 'none';
    });

    document.getElementById('tabGallery').addEventListener('click', () => {
      document.getElementById('tabGallery').classList.add('active');
      document.getElementById('tabSpin').classList.remove('active');
      document.getElementById('slotSection').style.display = 'none';
      document.getElementById('gallerySection').style.display = 'block';
      renderGallery();
    });

    function updateUI() {
      document.getElementById('diamond').innerText = userData.diamond;
      document.getElementById('totalCardsCount').innerText = userData.cards ? userData.cards.length : 0;
      renderGallery();
    }
  </script>
</body>
</html>
